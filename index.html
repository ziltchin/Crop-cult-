<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Cult | Karen, Nairobi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap');

        :root {
            --bg: #0A0907;
            --surface: #141311;
            --surface-light: #22201D;
            --gold: #D4A853;
            --gold-hover: #b88f41;
            --text-main: #F4F4F5;
            --text-muted: #A1A1AA;
            --border: #33312C;
            --nav-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; line-height: 1.6; }
        h1, h2, h3, h4, .serif { font-family: 'Playfair Display', serif; }
        .gold { color: var(--gold); }
        .italic { font-style: italic; }
        
        /* Custom Cursor */
        @media (min-width: 1024px) {
            #cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; transition: width 0.2s, height 0.2s; }
            #cursor-ring { position: fixed; width: 32px; height: 32px; border: 1px solid var(--gold); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9998; transition: width 0.3s, height 0.3s; transition-timing-function: ease-out; }
        }
        @media (max-width: 1023px) { * { cursor: auto !important; } #cursor-dot, #cursor-ring { display: none; } }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; background: var(--gold); color: var(--bg); font-weight: 500; text-decoration: none; border-radius: 4px; transition: all 0.3s ease; border: none; }
        .btn:hover { background: var(--gold-hover); transform: translateY(-2px); }
        .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        .btn-outline:hover { background: var(--gold); color: var(--bg); }
        
        .reveal { opacity: 0; transform: translateY(40px); transition: 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        nav { position: fixed; top: 0; width: 100%; height: var(--nav-height); z-index: 1000; display: flex; align-items: center; transition: 0.3s; }
        nav.scrolled { background: rgba(10, 9, 7, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .logo { font-size: 1.5rem; font-weight: 700; text-decoration: none; color: var(--text-main); }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .wa-nav-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--gold); padding: 8px 16px; border-radius: 30px; text-decoration: none; color: var(--gold); font-size: 0.9rem; }

        #hero { padding-top: calc(var(--nav-height) + 60px); min-height: 80vh; display: flex; align-items: center; }
        .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
        .hero-title { font-size: clamp(3rem, 6vw, 5.5rem); line-height: 1.1; margin-bottom: 1.5rem; }
        .hero-img-wrap { height: 500px; border-radius: 8px; overflow: hidden; position: relative; }
        .hero-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .ticker-wrap { background: var(--gold); padding: 12px 0; overflow: hidden; display: flex; white-space: nowrap; }
        .ticker { display: flex; animation: ticker 25s linear infinite; }
        .ticker span { color: var(--bg); font-weight: 600; padding: 0 2rem; text-transform: uppercase; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        #collection { padding: 100px 0; background: var(--surface-light); }
        .filters { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 8px 20px; border-radius: 30px; transition: 0.3s; }
        .filter-btn.active { background: var(--gold); color: var(--bg); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: 0.3s; position: relative; }
        .product-card:hover { transform: translateY(-5px); }
        .product-card.sold-out { opacity: 0.5; }
        .p-img-wrap { aspect-ratio: 3/4; overflow: hidden; }
        .p-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .p-info { padding: 1.5rem; }
        .p-cat { color: var(--gold); font-size: 0.8rem; text-transform: uppercase; }
        .p-name { font-size: 1.2rem; margin: 5px 0; }
        .p-price { font-weight: 600; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: flex-end; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .bottom-sheet { background: var(--surface); width: 100%; padding: 2rem; border-radius: 20px 20px 0 0; transform: translateY(100%); transition: 0.4s; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.active .bottom-sheet { transform: translateY(0); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 768px) { .modal-grid { grid-template-columns: 1fr; } .hero-grid { grid-template-columns: 1fr; } }

        #order { padding: 100px 0; }
        .order-box { max-width: 600px; margin: 0 auto; background: var(--surface); padding: 3rem; border-radius: 12px; border: 1px solid var(--border); }
        input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; margin-bottom: 1rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <nav id="navbar">
        <div class="container nav-inner">
            <a href="#" class="logo serif">Crop <span class="gold">Cult.</span></a>
            <div class="nav-links"><a href="#collection">Shop</a><a href="#order">Order</a></div>
            <a href="https://wa.me/254791550252" class="wa-nav-btn">WhatsApp</a>
        </div>
    </nav>

    <header id="hero">
        <div class="container hero-grid">
            <div class="reveal">
                <h1 class="hero-title">Elevate Your <span class="gold italic">Aesthetic.</span></h1>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Curated premium essentials. Based in Karen, Nairobi.</p>
                <a href="#collection" class="btn">View Collection</a>
            </div>
            <div class="hero-img-wrap reveal">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80">
            </div>
        </div>
    </header>

    <div class="ticker-wrap"><div class="ticker">
        <span>New Drops Weekly</span><span>Karen Nairobi Delivery</span><span>M-Pesa Accepted</span><span>Premium Quality</span>
        <span>New Drops Weekly</span><span>Karen Nairobi Delivery</span><span>M-Pesa Accepted</span><span>Premium Quality</span>
    </div></div>

    <section id="collection">
        <div class="container">
            <div class="filters" id="filter-container"></div>
            <div class="product-grid" id="product-grid"></div>
        </div>
    </section>

    <section id="order">
        <div class="container">
            <div class="order-box reveal">
                <h2 class="serif gold" style="text-align: center; margin-bottom: 2rem;">Place Your Order</h2>
                <form id="checkout-form">
                    <input type="text" id="cust-name" placeholder="Full Name" required>
                    <input type="tel" id="cust-phone" placeholder="Phone Number (M-Pesa)" required>
                    <input type="text" id="cust-items" placeholder="Item Name & Size" required>
                    <select id="cust-deliv">
                        <option value="Karen Pickup">Pickup in Karen</option>
                        <option value="NBO Delivery">Nairobi Delivery</option>
                    </select>
                    <button type="submit" class="btn" style="width:100%">Submit Request</button>
                </form>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="product-modal">
        <div class="bottom-sheet container">
            <button onclick="closeModal()" style="float:right; background:none; border:none; color:white; font-size:2rem;">&times;</button>
            <div class="modal-grid">
                <img id="m-img" style="width:100%; border-radius:8px;">
                <div>
                    <span id="m-cat" class="gold"></span>
                    <h2 id="m-title" class="serif" style="font-size:2.5rem; margin:10px 0;"></h2>
                    <h3 id="m-price" style="margin-bottom:20px;"></h3>
                    <p id="m-desc" style="color:var(--text-muted); margin-bottom:20px;"></p>
                    <p><strong>Available Sizes:</strong> <span id="m-sizes"></span></p>
                    <button class="btn" style="margin-top:2rem; width:100%;" onclick="buyNow()">Order Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMQyW1d9lbgAa690pGCCYseiwr7UHUuluMTJPNOMZ4qSaHLzrmbgCAoFvjAkQwCILBC0Jg618ry1cK/pub?output=csv";
        
        let products = [];
        let currentCategory = 'All';

        async function loadData() {
            try {
                const response = await fetch(SHEET_CSV);
                const data = await response.text();
                const rows = data.split('\n').slice(1);

                products = rows.filter(r => r.trim()).map(row => {
                    // Splits CSV while handling commas inside quotes
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        name: cols[1]?.replace(/"/g, '').trim(),
                        category: cols[2]?.replace(/"/g, '').trim(),
                        price: cols[3]?.replace(/"/g, '').trim(),
                        description: cols[4]?.replace(/"/g, '').trim(),
                        image: cols[5]?.replace(/"/g, '').trim(),
                        sizes: cols[6]?.replace(/"/g, '').trim(),
                        inStock: cols[7]?.replace(/"/g, '').trim().toUpperCase() === 'TRUE'
                    };
                });

                renderFilters();
                renderProducts();
            } catch (err) { console.error("Error loading sheet:", err); }
        }

        function renderFilters() {
            const cats = ['All', ...new Set(products.map(p => p.category))];
            document.getElementById('filter-container').innerHTML = cats.map(c => 
                `<button class="filter-btn ${c === currentCategory ? 'active' : ''}" onclick="filter('${c}')">${c}</button>`
            ).join('');
        }

        function filter(c) {
            currentCategory = c;
            renderFilters();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const filtered = currentCategory === 'All' ? products : products.filter(p => p.category === currentCategory);
            
            grid.innerHTML = filtered.map((p, i) => `
                <div class="product-card ${!p.inStock ? 'sold-out' : ''}" onclick="openModal(${i})">
                    <div class="p-img-wrap"><img src="${p.image}"></div>
                    <div class="p-info">
                        <span class="p-cat">${p.category}</span>
                        <h3 class="p-name serif">${p.name}</h3>
                        <p class="p-price gold">KES ${p.price}</p>
                    </div>
                </div>
            `).join('');
        }

        let selectedIdx = null;
        function openModal(i) {
            selectedIdx = i;
            const p = products[i];
            document.getElementById('m-img').src = p.image;
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-price').innerText = "KES " + p.price;
            document.getElementById('m-desc').innerText = p.description;
            document.getElementById('m-cat').innerText = p.category;
            document.getElementById('m-sizes').innerText = p.sizes;
            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }

        function buyNow() {
            const p = products[selectedIdx];
            document.getElementById('cust-items').value = p.name;
            closeModal();
            document.getElementById('order').scrollIntoView();
        }

        // Aesthetics & Nav
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Cursor
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        document.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
            setTimeout(() => { ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px'; }, 50);
        });

        window.onload = loadData;
    </script>
</body>
</html>
