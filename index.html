<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Cult | Karen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #FAF7F2; --dark: #1A1714; --accent: #C9A96E; }
        body { background: var(--cream); font-family: 'Jost', sans-serif; margin: 0; color: var(--dark); }
        nav { display: flex; justify-content: space-between; padding: 20px 30px; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 2px; font-size: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .img-container { aspect-ratio: 3/4; background: #eee; width: 100%; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 12px; }
        .p-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; margin-bottom: 5px; }
        .p-price { color: var(--accent); font-weight: 500; font-size: 14px; }
        .order-btn { display: block; width: 100%; padding: 15px; background: var(--dark); color: white; text-align: center; text-decoration: none; margin-top: 20px; font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">CROP CULT</div>
    <div style="font-size: 11px; letter-spacing: 1px;">KAREN, NAIROBI</div>
</nav>

<div class="grid" id="productGrid">Loading collection...</div>

<a href="https://wa.me/254791550252" class="order-btn">ORDER VIA WHATSAPP</a>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1-6-IAao1S3wi7xmiPlQOsHmz0ohMxfYHwf7sYGQ9cAQ/export?format=csv';

async function loadProducts() {
    try {
        const response = await fetch(SHEET_URL);
        const data = await response.text();
        
        // This splits the CSV rows correctly even if there are commas
        const rows = data.split('\n').slice(1); 
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        rows.forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Comma-safe split
            if (cols.length < 5) return;

            const name = cols[1]?.replace(/"/g, '');    // Column B
            const price = cols[3]?.replace(/"/g, '');   // Column D
            const img = cols[5]?.replace(/"/g, '');     // Column F

            grid.innerHTML += `
                <div class="card">
                    <div class="img-container">
                        <img src="${img}" alt="${name}" onerror="this.src='https://placehold.co/300x400?text=Image+Loading'">
                    </div>
                    <div class="info">
                        <div class="p-name">${name}</div>
                        <div class="p-price">KSh ${price}</div>
                    </div>
                </div>
            `;
        });
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('productGrid').innerHTML = "Check your internet or sheet sharing settings.";
    }
}

loadProducts();
</script>
</body>
</html>
