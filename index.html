<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Cult | Karen, Nairobi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root { --cream: #FAF7F2; --sand: #E8E0D4; --dark: #1A1714; --accent: #C9A96E; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--cream); font-family: 'Jost', sans-serif; color: var(--dark); line-height: 1.6; }
        
        /* Navigation */
        nav { padding: 25px 30px; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--sand); }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; }
        .location { font-size: 10px; letter-spacing: 2px; color: #888; }

        /* Hero Section */
        .hero { height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: var(--dark); color: var(--cream); padding: 40px; position: relative; overflow: hidden; }
        .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 64px; font-weight: 300; line-height: 0.9; margin-bottom: 20px; }
        .hero h1 em { color: var(--accent); font-style: italic; }
        .hero p { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }

        /* Collection Grid */
        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; text-align: center; margin-bottom: 40px; font-weight: 300; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        
        .card { background: white; border-radius: 2px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.3s ease; }
        .img-box { aspect-ratio: 3/4; background: #f0f0f0; width: 100%; position: relative; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 20px 15px; text-align: center; }
        .p-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; margin-bottom: 8px; font-weight: 400; }
        .p-price { color: var(--accent); font-size: 15px; font-weight: 500; letter-spacing: 1px; }

        /* Footer / CTA */
        .footer-cta { background: var(--dark); color: white; padding: 60px 20px; text-align: center; margin-top: 40px; }
        .wa-btn { display: inline-block; padding: 18px 40px; background: var(--accent); color: var(--dark); text-decoration: none; font-size: 12px; letter-spacing: 3px; font-weight: 600; text-transform: uppercase; transition: 0.3s; }
        .wa-btn:hover { background: white; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 48px; }
            .grid { gap: 10px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">Crop Cult</div>
    <div class="location">KAREN, NAIROBI</div>
</nav>

<section class="hero">
    <p>Premium Basics</p>
    <h1>Wear the<br><em>Cult.</em></h1>
</section>

<div class="container">
    <h2 class="section-title">Latest Collection</h2>
    <div class="grid" id="productGrid">
        </div>
</div>

<section class="footer-cta">
    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-bottom: 20px;">Ready to order?</h2>
    <p style="margin-bottom: 30px; font-weight: 200; opacity: 0.8;">Send us a screenshot on WhatsApp to secure your pieces.</p>
    <a href="https://wa.me/254791550252" class="wa-btn">Contact via WhatsApp</a>
    <p style="margin-top: 40px; font-size: 11px; opacity: 0.5;">© 2026 CROP CULT. KAREN END.</p>
</section>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1-6-IAao1S3wi7xmiPlQOsHmz0ohMxfYHwf7sYGQ9cAQ/export?format=csv';

async function loadProducts() {
    try {
        const response = await fetch(SHEET_URL);
        const data = await response.text();
        const rows = data.split('\n').slice(1); 
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        rows.forEach(row => {
            // This regex helps handle cells that might have commas inside quotes
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols.length < 5) return;

            const name = cols[1]?.replace(/"/g, '');    // Column B
            const price = cols[3]?.replace(/"/g, '');   // Column D
            const img = cols[5]?.replace(/"/g, '').trim(); // Column F

            grid.innerHTML += `
                <div class="card">
                    <div class="img-box">
                        <img src="${img}" alt="${name}" onerror="this.src='https://placehold.co/400x500?text=Crop+Cult'">
                    </div>
                    <div class="info">
                        <div class="p-name">${name}</div>
                        <div class="p-price">KSh ${price}</div>
                    </div>
                </div>
            `;
        });
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('productGrid').innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Unable to load products. Check sheet sharing settings.</p>";
    }
}

loadProducts();
</script>

</body>
</html>
