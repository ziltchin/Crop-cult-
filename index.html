<script>
// ============================================================
// 🔧 LIVE CONNECTION TO YOUR CROP CULT SPREADSHEET
// ============================================================
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1-6-IAao1S3wi7xmiPlQOsHmz0ohMxfYHwf7sYGQ9cAQ/export?format=csv';
const WHATSAPP_NUM = '254791550252'; 

let products = [];
let activeFilter = 'All';

// Convert Google Drive links to direct images
function fixImageUrl(url) {
    if (!url) return '';
    const cleanUrl = url.replace(/"/g, '').trim();
    if (cleanUrl.includes('drive.google.com')) {
        const id = cleanUrl.split('/d/')[1]?.split('/')[0] || cleanUrl.split('id=')[1];
        return id ? `https://lh3.googleusercontent.com/d/${id}` : cleanUrl;
    }
    return cleanUrl;
}

// Robust CSV parser
function parseCSV(text) {
    const lines = text.split(/\r?\n/);
    return lines.slice(1).map(line => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            let char = line[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
            else cur += char;
        }
        result.push(cur.trim());
        return result;
    });
}

// Load products from Google Sheet
async function loadProducts() {
    try {
        const response = await fetch(SHEET_CSV);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.text();
        const rows = parseCSV(data);

        products = rows.map(cols => ({
            Name: cols[1]?.replace(/"/g, ''),
            Category: cols[2]?.replace(/"/g, '') || 'Essentials',
            Price: cols[3]?.replace(/"/g, ''),
            Description: cols[4]?.replace(/"/g, ''),
            Image: fixImageUrl(cols[5]),
            Sizes: cols[6]?.replace(/"/g, '') || 'S, M, L',
            Available: 'Yes'
        })).filter(p => p.Name && p.Name.length > 1);

        renderAll();
    } catch (error) {
        console.error('Error loading Sheet:', error);
        const grid = document.getElementById('productGrid');
        if (grid) grid.innerHTML = '<div class="grid-state">Error loading products. Please refresh.</div>';
    }
}

// Render everything
function renderAll() {
    buildFilters();
    renderGrid(products);
}

// Build category filter tabs
function buildFilters() {
    const cats = ['All', ...new Set(products.map(p => p.Category).filter(Boolean))];
    const filterTabs = document.getElementById('filterTabs');
    if (filterTabs) {
        filterTabs.innerHTML = cats.map(c =>
            `<button class="filter-pill ${c === activeFilter ? 'active' : ''}" onclick="filterBy('${c}', this)">${c}</button>`
        ).join('');
    }
}

// Filter by category
function filterBy(cat, btn) {
    activeFilter = cat;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = (cat === 'All') ? products : products.filter(p => p.Category === cat);
    renderGrid(filtered);
}

// Render product grid
function renderGrid(list) {
    const grid = document.getElementById('productGrid');
    if (!grid) return;

    grid.innerHTML = list.map((p) => {
        const imgEl = p.Image 
            ? `<img class="pimg" src="${p.Image}" alt="${p.Name}" loading="lazy" onerror="this.src='https://placehold.co/800x1000?text=CULT+BASICS'"/>`
            : `<div class="pimg-placeholder"><span>👗</span><p>Photo coming soon</p></div>`;

        return `
        <div class="product-card" onclick="openModal(${products.indexOf(p)})">
            <div class="product-img-wrap">
                ${imgEl}
                <div class="product-overlay"></div>
                <button class="product-quick-order">Quick Order</button>
            </div>
            <div class="product-info">
                <div class="product-cat">${p.Category}</div>
                <div class="product-name">${p.Name}</div>
                <div class="product-price">KSh ${p.Price}</div>
            </div>
        </div>`;
    }).join('');
}

// Open product modal
function openModal(idx) {
    const p = products[idx];
    if (!p) return;
    document.getElementById('mCat').textContent = p.Category;
    document.getElementById('mName').textContent = p.Name;
    document.getElementById('mPrice').textContent = 'KSh ' + p.Price;
    document.getElementById('mDesc').textContent = p.Description || 'Premium piece from Crop Cult.';
    
    const sizeContainer = document.getElementById('mSizes');
    sizeContainer.innerHTML = p.Sizes.split(/[;,]/).map(s => 
        `<div class="size-chip" onclick="selectSize(this)">${s.trim()}</div>`
    ).join('');
    
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
    window.activeProduct = p; 
}

// Select size in modal
function selectSize(el) {
    document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

// Close modal
function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
}

// Order from modal
function orderFromModal() {
    const p = window.activeProduct;
    if (!p) return;
    const size = document.querySelector('.size-chip.selected')?.textContent || 'Default';
    const text = encodeURIComponent(`Hi Crop Cult! I want to order:\n\nItem: ${p.Name}\nSize: ${size}\nPrice: KSh ${p.Price}`);
    window.open(`https://wa.me/${WHATSAPP_NUM}?text=${text}`, '_blank');
}

// Close modal when clicking outside
function handleModalClick(e) {
    if (e.target.id === 'modal') closeModal();
}

// Scroll effect for nav
window.addEventListener('scroll', () => {
    const nav = document.getElementById('nav');
    if (nav) nav.classList.toggle('scrolled', window.scrollY > 60);
});

// Custom cursor effect (desktop only)
if (window.innerWidth > 900) {
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    document.addEventListener('mousemove', e => {
        if (cursor && ring) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            ring.style.left = e.clientX + 'px';
            ring.style.top = e.clientY + 'px';
        }
    });
}

// Initial Load
loadProducts();
</script>
