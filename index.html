<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROP CULT — Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #8c764d; --light-grey: #f9f9f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

        /* Navigation */
        nav { padding: 30px; display: flex; justify-content: space-between; align-items: center; background: white; sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; letter-spacing: 6px; text-transform: uppercase; }
        .nav-right { font-size: 11px; letter-spacing: 2px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--text); padding-bottom: 2px; cursor: pointer; }

        /* Editorial Hero Section */
        .hero { display: grid; grid-template-columns: 1fr 1fr; height: 80vh; border-bottom: 1px solid #eee; }
        .hero-text { display: flex; flex-direction: column; justify-content: center; padding: 10%; border-right: 1px solid #eee; }
        .hero-text span { font-size: 12px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; color: var(--accent); }
        .hero-text h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 8vw, 85px); font-weight: 300; line-height: 0.9; margin-bottom: 30px; }
        .hero-text h1 em { font-style: italic; }
        .hero-img { background: #f4f4f4; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-style: italic; color: #ccc; font-size: 20px; }

        /* Collection */
        .container { padding: 80px 40px; }
        .filter-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .filter-bar h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px; }
        .card { transition: opacity 0.4s ease; cursor: pointer; }
        .card:hover { opacity: 0.8; }
        .img-box { aspect-ratio: 4/5; background: var(--light-grey); margin-bottom: 20px; overflow: hidden; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { display: flex; justify-content: space-between; align-items: flex-start; }
        .p-details h3 { font-size: 14px; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .p-details p { font-size: 13px; color: #666; font-family: 'Cormorant Garamond', serif; font-style: italic; }
        .p-price { font-size: 14px; font-weight: 600; }

        /* WhatsApp Button */
        .wa-float { position: fixed; bottom: 30px; right: 30px; background: var(--text); color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-size: 11px; letter-spacing: 2px; font-weight: 600; z-index: 1000; transition: transform 0.3s; }
        .wa-float:hover { transform: scale(1.05); background: var(--accent); }

        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; height: auto; }
            .hero-text { padding: 60px 30px; border-right: none; border-bottom: 1px solid #eee; }
            .hero-img { height: 300px; }
            .grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .container { padding: 40px 15px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">CROP CULT</div>
    <div class="nav-right">Nairobi</div>
</nav>

<section class="hero">
    <div class="hero-text">
        <span>Est. 2024</span>
        <h1>The <em>Art</em> of the <br>Basic.</h1>
    </div>
    <div class="hero-img">
        [ SS26 Collection ]
    </div>
</section>

<div class="container">
    <div class="filter-bar">
        <h2>Collection</h2>
        <div style="font-size: 11px; letter-spacing: 1px; color: #999;">SCROLL TO EXPLORE</div>
    </div>
    <div class="grid" id="productGrid">
        </div>
</div>

<a href="https://wa.me/254791550252" class="wa-float">ORDER VIA WHATSAPP</a>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1-6-IAao1S3wi7xmiPlQOsHmz0ohMxfYHwf7sYGQ9cAQ/export?format=csv';

async function loadProducts() {
    try {
        const response = await fetch(SHEET_URL);
        const data = await response.text();
        const rows = data.split('\n').slice(1); 
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        rows.forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (cols.length < 5) return;

            const name = cols[1]?.replace(/"/g, '');    
            const price = cols[3]?.replace(/"/g, '');   
            const desc = cols[4]?.replace(/"/g, '') || 'Essential Piece';
            const img = cols[5]?.replace(/"/g, '').trim(); 

            grid.innerHTML += `
                <div class="card">
                    <div class="img-box">
                        <img src="${img}" alt="${name}" onerror="this.src='https://placehold.co/600x800?text=Crop+Cult+Basics'">
                    </div>
                    <div class="info">
                        <div class="p-details">
                            <h3>${name}</h3>
                            <p>${desc}</p>
                        </div>
                        <div class="p-price">KSh ${price}</div>
                    </div>
                </div>
            `;
        });
    } catch (error) {
        console.error('Error:', error);
    }
}

loadProducts();
</script>

</body>
</html>
